# Article editor at /admin (Sveltia CMS). It reads and writes the Markdown
# files in src/content/articles through GitHub. The fields and limits here
# match the checks in src/content/articles.ts, which run on every build and
# have the final say: a file the editor lets through but the build rejects
# never goes live.
#
# Sign in with a GitHub fine-grained token scoped to allahcall/allahcallhome
# with Contents and Pull requests: read and write. See docs/articles/README.md.

app_title: AllahCall articles
display_url: https://allahcall.com

backend:
  name: github
  repo: allahcall/allahcallhome
  branch: main
  auth_methods: [token]
  squash_merges: true
  commit_messages:
    create: "Add article: {{slug}}"
    update: "Update article: {{slug}}"
    delete: "Remove article: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

# Every save becomes a pull request. Publishing merges it, after Vercel's
# build (which runs the article checks) passes.
publish_mode: editorial_workflow

media_folder: /public/articles
public_folder: /articles

# Uploaded images are resized to at most 1600 pixels wide and saved as WebP
# (PNG in browsers that can't make WebP, such as Safari). The build also
# rejects article images over 5 MB, whatever their source.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 80

output:
  omit_empty_optional_fields: true

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: Articles on the research page. Each one is published at /research/ followed by its file name.
    icon: article
    folder: /src/content/articles
    extension: md
    format: frontmatter
    preview_path: /research/{{slug}}
    # The address. It can't reuse a paper's address: the build checks this
    # list against src/content/research.ts, so add new paper slugs here too.
    slug:
      template: "{{title}}"
      editable: true
      hint: "The article's address, /research/ followed by this. Lowercase words joined by hyphens."
      pattern:
        - '^(?!(?:craig-kalam-and-classical-kalam|naturalness-of-religious-belief|cumulative-case-for-god|design-argument-in-classical-theism|critiquing-intelligent-design|ontological-arguments|oneness-of-god-in-islamic-theology|ghazali-infinite-regress|fitrah-beyond-arguments|finite-cosmos-infinite-creator|quranic-response-to-nihilism|harari-sapiens-and-religion|re-evaluating-scientism|spirituality-between-atheism-and-theism|man-or-god|surah-al-asr-crisis-of-humanism|maududi-response-to-atheism|ghazali-and-the-decline-of-science|burden-of-proof-atheism|surah-al-fil-and-imperialism|surah-al-humazah-and-materialism|quranic-and-biblical-accounts-of-nuh|kalam-cosmology-and-the-trinity|seerah-and-islamophobia|science-of-hidden-hadith-defects|conditions-for-ijtihad|ghazwa-e-hind-hadiths|standard-for-interpreting-quran-and-hadith|ghamidi-principles-critical-review|locke-natural-rights-and-islamic-rights|constitution-of-madina|human-rights-epistemological-basis|islamic-and-atlantic-slavery|gender-equality-vs-gender-justice|womens-rights-islam-and-the-west|feminism-and-the-family|colonization-and-liberalism|loneliness-solidarity-and-democide|free-speech-and-the-muslim-exception|how-islam-responds-to-liberalism|riba-as-structural-distortion)$)[a-z0-9]+(?:-[a-z0-9]+)*$'
        - 'Use lowercase words joined by hyphens, and not the address of an existing paper'
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Title
        widget: string
        pattern: ['^.{1,120}$', 'Keep the title under 120 characters']
      - name: topic
        label: Topic
        widget: select
        hint: "The section of the research page it is listed under."
        options:
          - { label: "God and belief", value: god }
          - { label: "Modern thought", value: modern }
          - { label: "Qur'an and Sunnah", value: quran }
          - { label: "Society and rights", value: society }
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: summary
        label: Summary
        widget: text
        hint: "One or two sentences under the title and on the research page."
        pattern: ['^[\s\S]{1,320}$', 'Keep the summary under 320 characters']
      - name: authors
        label: Authors
        label_singular: Author
        widget: list
        required: false
        default: [Muhammad Harris Suhaib]
        hint: "Leave empty for Muhammad Harris Suhaib alone."
        field:
          name: author
          label: Name
          widget: string
          pattern: ['^.{1,80}$', 'Keep each name under 80 characters']
      - name: pdf
        label: Full paper (PDF)
        widget: string
        required: false
        hint: "Optional. A link starting https:// (Zenodo, journal), or /papers/file-name.pdf for a PDF added to public/papers."
        pattern: ['^(https://\S+|/papers/[\w.-]+\.pdf)$', 'Use an https:// link or /papers/file-name.pdf']
      - name: draft
        label: Draft
        widget: boolean
        required: false
        default: false
        hint: "Drafts are saved but never shown on the site."
      - name: body
        label: Article
        widget: markdown
        hint: "Use Heading 2 and 3 for sections; the title is already the top heading. Links must start with https://, mailto: or /. Add images with the image button, and give each one a description."
        # Mirrors the build's checks on the text: no # heading, no HTML, link
        # targets, and images uploaded here with a description.
        pattern:
          - '/^(?<![\s\S])(?![\s\S]*^#[ \t])(?![\s\S]*(?:<!--|<\/?[a-zA-Z][a-zA-Z0-9-]*(?:\s[^>]*)?\/?>))(?![\s\S]*\]\((?!https:\/\/|mailto:|\/|#))(?![\s\S]*!\[\s*\]\()(?![\s\S]*!\[[^\]]*\]\((?!\/articles\/))[\s\S]*$/m'
          - 'Not allowed in the text: HTML, a heading with a single #, links that don''t start with https://, mailto: or /, and images without a description or not uploaded here'
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
        linked_images: false
        use_emoji_autocomplete: false
